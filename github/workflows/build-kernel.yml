name: Build Kernel

     on:
       push:
         branches:
           - main  blu_spark-15
       pull_request:
         branches:
           - main

     jobs:
       build:
         runs-on: ubuntu-latest
         steps:
           - name: Checkout repository
             uses: actions/checkout@v3

           - name: Install dependencies
             run: |
               sudo apt update
               sudo apt install -y build-essential libncurses-dev bison flex libssl-dev

           - name: Build kernel
             run: |
               make -j$(nproc)
